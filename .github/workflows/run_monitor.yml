name: Daily Competitor Monitor
on:
  schedule:
    # Legacy fallback only. Disable with EXTERNAL_SCHEDULER_ENABLED=true after cutover.
    - cron: '45 18 * * *'
    - cron: '49 0 * * *'
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: 'Original scheduled time in ISO 8601 UTC (external scheduler)'
        type: string
        required: false
      schedule_source:
        description: 'Scheduler name for timing diagnostics'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: monitoring-data
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'schedule' || vars.EXTERNAL_SCHEDULER_ENABLED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60


    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 라이브러리 설치
      run: pip install -r requirements.txt

    - name: 예정 및 실제 실행 시각 기록
      env:
        SCHEDULE_CRON: ${{ github.event.schedule }}
        SCHEDULED_AT: ${{ inputs.scheduled_at }}
        SCHEDULE_SOURCE: ${{ inputs.schedule_source }}
      run: python scripts/run_timing.py

    # ── Step 1: 크롤러 ────────────────────────────────────────────────
    - name: 1단계 - 크롤러 실행
      id: crawler
      run: python main.py

    # ── Step 2: 유의사항 정리 ─────────────────────────────────────────
    - name: 2단계 - 유의사항 정리 실행
      id: parser
      env:
        PROMOTION_MAIL_DIR: ${{ runner.temp }}/promotion-mail
      run: |
        if ls data/data_*.json 1>/dev/null 2>&1; then
          python parser.py
        else
          echo "⚠️ 수집 데이터 없음 — 정리 건너뜀"
        fi

    # ── Step 3: 결과 커밋 ─────────────────────────────────────────────
    - name: 3단계 - 결과 저장 및 커밋
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        echo "Last Run: $(date)" > last_update.txt
        git add data/*.json data/*.csv last_update.txt
        git diff --cached --quiet && echo "변경사항 없음" || git commit -m "🚨 Daily Update: $(date)"
        git pull --rebase origin main
        git push

    # ── Step 4: streamlit-deploy 브랜치 경량화 동기화 ──────────────────
    # main은 원본 전체를 영구 보존(삭제 없음). Streamlit Cloud는 이 가벼운
    # 브랜치에서 배포해서 무한 부팅(OOM) 문제를 피한다.
    #
    # ※ orphan 브랜치를 쓰는 이유:
    #   git checkout -B 는 main의 히스토리를 그대로 상속한다.
    #   main에는 notices_history.csv(약 97MB) 버전이 커밋마다 쌓여 있어서
    #   클론 시 수 GB 규모의 델타 체인을 복원해야 하고, Streamlit Cloud가
    #   이 과정에서 타임아웃 → "Cloning repository..." 무한 재시도에 빠진다.
    #   orphan은 부모 없는 단일 커밋이라 히스토리를 전혀 물려받지 않는다.
    - name: 4단계 - streamlit-deploy 브랜치 갱신
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git checkout --orphan deploy-tmp

        # 원본 크롤링 JSON은 최신 10개만 유지 (앱은 최신 2개만 사용)
        ls -1t data/data_*.json 2>/dev/null | tail -n +11 | xargs -r rm --

        # 90MB 넘어서 보관용으로 분리된 과거 history 파일은 앱에서 안 쓰므로 제외
        rm -f data/*_archive_*.csv

        # notices_history.csv는 최근 45일만 유지 (차트는 30일만 사용)
        python scripts/trim_history.py

        # Streamlit Cloud 빌드는 크롤러용 무거운 의존성이 필요 없음
        cp requirements-streamlit.txt requirements.txt

        git add -A
        git commit -m "🪶 Deploy sync: $(date)" || echo "변경사항 없음"
        git push -f origin deploy-tmp:streamlit-deploy

        git checkout -f main
        git branch -D deploy-tmp

    # 메일 장애가 수집 데이터 커밋/대시보드 배포를 막지 않도록 마지막에 전송한다.
    - name: 프로모션 변경 메일 발송
      if: ${{ always() && steps.parser.outcome == 'success' && steps.parser.outputs.mail_needed == 'true' }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_APP_PASSWORD }}
        subject: file://${{ runner.temp }}/promotion-mail/subject.txt
        to: jiwonchoi@sk.com
        from: Promotion Monitor
        body: file://${{ runner.temp }}/promotion-mail/body.txt

    - name: 프로모션 수집 실패 메일 발송
      if: ${{ failure() && (steps.crawler.outcome == 'failure' || steps.parser.outcome == 'failure') }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_APP_PASSWORD }}
        subject: '[프로모션] 수집 또는 분석 실패'
        to: jiwonchoi@sk.com
        from: Promotion Monitor
        body: |
          프로모션 수집 또는 분석이 실패했습니다. 이번 실행의 데이터 갱신이 완료되지 않았습니다.
          실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
