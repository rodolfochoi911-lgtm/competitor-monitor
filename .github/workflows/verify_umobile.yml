name: Verify UMobile live extraction
on:
  pull_request:
    paths:
      - 'scripts/verify_umobile.py'
      - '.github/workflows/verify_umobile.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_umobile.py'
      - '.github/workflows/verify_umobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install pandas beautifulsoup4 requests python-dotenv selenium undetected-chromedriver
      - name: Validate active event code and countdown normalization
        run: python -u scripts/verify_umobile.py
