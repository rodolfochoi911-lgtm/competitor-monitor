name: Verify reported extraction failure
on:
  push:
    branches: [main]
    paths:
      - 'monitor_core.py'
      - 'content_extractor.py'
      - 'scripts/verify_extraction.py'
      - '.github/workflows/verify_extraction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install pandas beautifulsoup4 requests python-dotenv selenium undetected-chromedriver
      - name: Check reported page and parser without sending notifications
        run: python -u scripts/verify_extraction.py
